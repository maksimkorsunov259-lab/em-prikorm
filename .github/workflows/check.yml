name: Check application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/*.test.cjs
      - run: python tools/build_sw.py && git diff --exit-code -- sw.js report-css.js
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - name: Browser flows and storage failures
        run: |
          python -m http.server 8040 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/.." > /tmp/em-prikorm-server.log 2>&1 &
          export APP_URL="http://127.0.0.1:8040/$(basename "$GITHUB_WORKSPACE")/"
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python - <<'PYTEST'
          import subprocess, sys
          tests = ['tests/browser_flows.py', 'tests/browser_edges.py', 'tests/browser_updates.py', 'tests/browser_nutrition_install.py', 'tests/browser_content_profile.py', 'tests/browser_about.py', 'tests/browser_reaction.py', 'tests/browser_update_recovery.py', 'tests/browser_catalog_revision.py', 'tests/browser_food_marks.py', 'tests/browser_repeat_choking.py', 'tests/browser_catalog_guidance.py']
          for test in tests:
              result = subprocess.run([sys.executable, test], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              print(result.stdout, flush=True)
              if result.returncode:
                  message = result.stdout[-6000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title={test}::{message}', flush=True)
                  sys.exit(result.returncode)
          PYTEST
